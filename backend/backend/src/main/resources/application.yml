spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pockettrack}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  mail:
      host: smtp.gmail.com
      port: 587
      username: ${MAIL_USERNAME:bhavish.pushkarna2005@gmail.com}
      password: ${MAIL_PASSWORD:your_local_app_password}  
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      ssl:
        enabled: ${REDIS_SSL:false}

server:
  port: 8080

servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:my-super-secret-jwt-key-for-pockettrack-change-in-production-2026}
    expiration: 604800000
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    api-url: https://generativelanguage.googleapis.com/v1beta/models